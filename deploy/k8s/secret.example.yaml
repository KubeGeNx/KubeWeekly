# Template only — do NOT commit a real copy of this file with secrets filled
# in. Copy it out of deploy/k8s/, fill in real values, and apply it directly
# (kubectl apply -f), separately from the kustomization.
apiVersion: v1
kind: Secret
metadata:
  name: kubeweekly-secrets
  namespace: kubeweekly
type: Opaque
stringData:
  # Only the key matching LLM_PROVIDER (set in cronjob.yaml, default
  # "deepseek") actually needs a real value - the other can stay a placeholder.
  anthropic-api-key: "REPLACE_ME_IF_LLM_PROVIDER_IS_claude"
  deepseek-api-key: "REPLACE_ME_IF_LLM_PROVIDER_IS_deepseek"
  github-token: "REPLACE_ME_OPTIONAL"   # raises GitHub API rate limits
  nvd-api-key: "REPLACE_ME_OPTIONAL"    # raises NVD CVE API rate limits
